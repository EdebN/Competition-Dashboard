<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Team Editor Access</title>
<style>
:root{color-scheme:dark;--bg:#0b0e14;--panel:#111722;--line:#273247;--text:#edf2fa;--muted:#8e9bb0;--accent:#8b7cff;--mint:#55d6be}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(ellipse at 50% 0%,#20213c 0,transparent 50%),var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,-apple-system,sans-serif}
.card{width:min(100%,460px);padding:30px;border:1px solid var(--line);border-radius:22px;background:rgba(17,23,34,.96);box-shadow:0 25px 80px #0006}
.mark{display:grid;place-items:center;width:48px;height:48px;border-radius:15px;background:linear-gradient(135deg,var(--accent),var(--mint));color:#10131c;font-size:25px;font-weight:900}
.eyebrow{margin:23px 0 8px;color:var(--mint);font-size:10px;font-weight:850;letter-spacing:.16em}
h1{margin:0;font-size:30px;letter-spacing:-.04em}p{color:var(--muted);font-size:13px;line-height:1.7}
label{display:block;margin:22px 0 7px;color:#b5c0d0;font-size:11px;font-weight:800;letter-spacing:.08em}
input{width:100%;padding:15px;border:1px solid #344157;border-radius:11px;background:#0b1018;color:white;font-size:23px;letter-spacing:.28em;text-align:center;outline:none}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px #8b7cff22}
button,.link{display:flex;justify-content:center;align-items:center;width:100%;margin-top:12px;padding:13px;border:1px solid var(--accent);border-radius:10px;background:var(--accent);color:white;font-size:11px;font-weight:900;letter-spacing:.08em;text-decoration:none;cursor:pointer}
.secondary{background:transparent;border-color:#303b4c;color:#b9c5d6}
.status{min-height:24px;margin-top:13px;font-size:12px;color:#ffb4a9}
.note{margin-top:22px;padding-top:17px;border-top:1px solid var(--line);font-size:11px}
</style>
</head>
<body>
<main class="card">
  <div class="mark">✦</div>
  <div class="eyebrow">TEAM WORKSPACE</div>
  <h1>Your team. Your page.</h1>
  <p>Enter the PIN supplied by your competition administrator to open your team's page editor.</p>
  <form id="accessForm">
    <label for="teamPin">TEAM EDITOR PIN</label>
    <input id="teamPin" type="password" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" placeholder="••••••" required>
    <button type="submit">OPEN MY EDITOR ↗</button>
  </form>
  <div class="status" id="status" role="status" aria-live="polite"></div>
  <a class="link secondary" href="index.html">BACK TO COMPETITION DASHBOARD</a>
  <p class="note">PIN sharing is currently a prototype. PINs generated in Admin are stored in that browser only, so they won't yet work on another device.</p>
</main>
<script>
const STORE_KEY = "team-editor-pins-v1";
document.getElementById("accessForm").addEventListener("submit", event => {
  event.preventDefault();
  const pin = document.getElementById("teamPin").value.trim();
  const status = document.getElementById("status");
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem(STORE_KEY) || "{}") || {}; } catch {}
  const match = Object.entries(saved).find(([teamId, entry]) =>
    ["A","B","C","D","E"].includes(teamId) && String(entry?.pin || "") === pin
  );
  if (!/^\d{6}$/.test(pin) || !match) {
    status.textContent = "That PIN wasn't found in this browser. Check it or ask the admin to generate a new one.";
    return;
  }
  const [teamId] = match;
  sessionStorage.setItem("team-editor-authorized-team", teamId);
  location.href = "studio.html?team=" + encodeURIComponent(teamId);
});
</script>
</body>
</html>
